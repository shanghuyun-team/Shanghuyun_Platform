<!DOCTYPE html>
<html lang="zh-Hant" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>新增商品 – Sneat Lite Demo</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Plugins CSS (MIT / BSD) -->
    <link href="https://cdn.jsdelivr.net/npm/dropzone@5.9.3/dist/min/dropzone.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/css/tom-select.bootstrap5.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet" />

    <style>
      body {
        background-color: #f5f5f9;
      }
      .ts-wrapper.multi.has-items .ts-control > div {
        background: var(--bs-primary-bg-subtle);
        color: var(--bs-primary);
      }
    </style>
  </head>
  <body>
    <div class="container-xxl py-5">
      <div class="card shadow-sm border-0">
        <div class="card-header">
          <h4 class="mb-0">新增商品</h4>
        </div>
        <div class="card-body">
          <form id="productForm" novalidate>
            <div class="row g-4">
              <!-- 基本資訊 -->
              <div class="col-lg-8">
                <div class="mb-3">
                  <label for="productName" class="form-label">商品名稱<span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="productName" placeholder="輸入商品名稱" required />
                  <div class="invalid-feedback">此欄位為必填</div>
                </div>

                <div class="row g-3">
                  <div class="col-md-6">
                    <label for="vendorSelect" class="form-label">供應商</label>
                    <select id="vendorSelect" placeholder="選擇供應商…">
                      <option value="">請選擇</option>
                      <option value="1">尚虎雲股份有限公司</option>
                      <option value="2">藍天數位</option>
                      <option value="3">綠日電子</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <label for="categorySelect" class="form-label">分類</label>
                    <select id="categorySelect" multiple placeholder="搜尋或新增分類…">
                      <option value="手機">手機</option>
                      <option value="配件">配件</option>
                      <option value="3C">3C</option>
                    </select>
                  </div>
                </div>

                <div class="mb-3 mt-3">
                  <label for="tagsInput" class="form-label">標籤</label>
                  <input id="tagsInput" placeholder="輸入後 Enter 新增標籤" />
                </div>

                <div class="mb-3 row g-3">
                  <div class="col-md-6">
                    <label for="priceInput" class="form-label">價格 (NT$)</label>
                    <input type="text" class="form-control" id="priceInput" placeholder="0" />
                  </div>
                  <div class="col-md-6">
                    <label for="shipDate" class="form-label">開賣日期區間</label>
                    <input type="text" class="form-control" id="shipDate" placeholder="YYYY-MM-DD ~ YYYY-MM-DD" />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label">敘述</label>
                  <div id="descEditor" style="height: 220px"></div>
                </div>
              </div>

              <!-- 圖片上傳 -->
              <div class="col-lg-4">
                <label class="form-label d-block">商品圖片</label>
                <div id="productImages" class="dropzone border border-2 rounded-3"></div>
              </div>
            </div>

            <hr class="my-4" />

            <div class="text-end">
              <button type="submit" class="btn btn-primary" id="submitBtn">儲存</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Core JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Plugins JS -->
    <script src="https://cdn.jsdelivr.net/npm/dropzone@5.9.3/dist/min/dropzone.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.3.1/dist/js/tom-select.complete.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@yaireo/tagify/dist/tagify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/cleave.js@1.6.0/dist/cleave.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.10.0/dist/sweetalert2.all.min.js"></script>

    <script>
      // 停止 Dropzone 自動尋找 element
      Dropzone.autoDiscover = false;

      window.addEventListener('DOMContentLoaded', () => {
        // Dropzone – 商品圖片 (延遲到 submit 才處理)
        const dz = new Dropzone('#productImages', {
          url: '/api/upload/', // TODO: 替換為實際 API
          maxFiles: 5,
          acceptedFiles: 'image/*',
          addRemoveLinks: true,
          dictDefaultMessage: '拖曳圖片到此或點擊上傳',
          autoProcessQueue: false,
          parallelUploads: 5,
        });

        // Tom Select – 供應商 & 分類
        new TomSelect('#vendorSelect', {
          create: false,
          sortField: 'text',
        });
        new TomSelect('#categorySelect', {
          create: true,
          maxItems: 5,
        });

        // Tagify – 標籤
        new Tagify(document.querySelector('#tagsInput'));

        // Flatpickr – 日期區間
        flatpickr('#shipDate', {
          mode: 'range',
          dateFormat: 'Y-m-d',
          locale: 'zh_tw',
        });

        // Quill – 商品敘述
        const quill = new Quill('#descEditor', {
          theme: 'snow',
        });

        // Cleave – 價格格式化
        new Cleave('#priceInput', {
          numeral: true,
          numeralThousandsGroupStyle: 'thousand',
        });

        // Bootstrap 驗證 + SweetAlert2 + 手動上傳圖片
        const form = document.getElementById('productForm');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          if (!form.checkValidity()) {
            form.classList.add('was-validated');
            Swal.fire({ icon: 'error', title: '請檢查必填欄位' });
            return;
          }

          // 禁用按鈕避免重複送出
          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>上傳中…';

          // 如果有排隊中的檔案，先上傳完再送表單
          if (dz.getQueuedFiles().length) {
            dz.on('queuecomplete', () => {
              finalizeSubmit();
            });
            dz.processQueue();
          } else {
            finalizeSubmit();
          }
        });

        function finalizeSubmit() {
          // TODO: 這裡實際 fetch API，把表單資料 + 圖片 filename 送到後端
          // 模擬成功
          setTimeout(() => {
            Swal.fire({ icon: 'success', title: '已儲存', timer: 1500, showConfirmButton: false });
            submitBtn.disabled = false;
            submitBtn.innerText = '儲存';
            dz.removeAllFiles();
            form.reset();
            quill.setText('');
          }, 600);
        }
      });
    </script>
  </body>
</html>
