{% extends "base.html" %}
{% load static %}

{% block extra_css %}<link href="{% static 'monitoring/css/monitoring.css' %}" rel="stylesheet">{% endblock %}

{% block content %}
<main class="main">
  <div class="page-title position-relative" data-aos="fade" style="background-image: url({% static 'assets/img/page-title-bg.webp' %});">
    <div class="container position-relative">
      <h1>刪除感測器</h1>
      <nav class="breadcrumbs"><ol>
        <li><a href="/">首頁</a></li>
        <li><a href="{% url 'monitoring:dashboard' %}">生產監控</a></li>
        <li class="current">刪除</li>
      </ol></nav>
    </div>
  </div>

  <section class="monitoring-section section-bg">
    <div class="container" data-aos="fade-up">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="monitoring-card">
            <div class="card-header-custom"><h3><i class="bi bi-exclamation-triangle text-danger me-2"></i>確認刪除</h3></div>
            <div class="card-body-custom text-center">
              <p class="mb-1">您確定要刪除以下感測器嗎？</p>
              <h4 class="text-warning my-3">{{ sensor.name }}</h4>
              <p class="text-muted small">此操作無法復原，所有相關的感測數據也將一併刪除。</p>
              <form method="post" class="mt-4">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                  <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-2"></i>確認刪除</button>
                  <a href="{% url 'monitoring:sensor_detail' sensor.pk %}" class="btn-monitoring-outline">取消</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>
{% endblock content %}
